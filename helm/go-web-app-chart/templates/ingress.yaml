# Ingress resource for the application
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-web-app
  # annotations:
  #   nginx.ingress.kubernetes.io/rewrite-target: /courses
spec:
  ingressClassName: nginx
  rules:
  - host: www.naveengoapp.website
    http:
      paths: 
      - path: /
        pathType: Prefix
        backend:
          service:
            name: go-web-app
            port:
              number: 80
